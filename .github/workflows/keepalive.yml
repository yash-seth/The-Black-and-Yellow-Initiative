name: keep-alive

# Pings the deployed health endpoint so the free Supabase project never pauses.
# Set the repo secret HEALTH_URL to:
#   https://<your-app>.vercel.app/api/health?secret=<HEALTH_PING_SECRET>

on:
  schedule:
    - cron: "17 6 */3 * *" # every 3 days at 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health endpoint
        run: |
          if [ -z "${{ secrets.HEALTH_URL }}" ]; then
            echo "HEALTH_URL secret not set" >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/body.json -w "%{http_code}" "${{ secrets.HEALTH_URL }}")
          echo "HTTP $code"
          cat /tmp/body.json
          test "$code" = "200"
